<div class="devices-page-wrapper">
  <!-- Container principal -->
  <div class="devices-container">
    
    <!-- Header -->
    <header class="header">
      <h1>Aparatele Mele</h1>
      <button class="logout-btn" (click)="onLogout()" aria-label="Logout">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
      </button>
    </header>

    <!-- Buton adăugare aparat -->
    <div class="add-device-section">
      <button class="add-device-btn" (click)="onAddDevice()">
        <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="icon-plus">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
        </svg>
        Adaugă Aparat Nou
      </button>
    </div>

    <!-- Lista aparate -->
    <div class="devices-list">
      <div class="device-card" *ngFor="let device of devices" (click)="onDeviceClick(device.name)">
        <div class="card-content">
          <div class="card-header">
            <span class="status-dot" [class.connected]="device.isConnected"></span>
            <h2 class="device-name">{{ device.name }}</h2>
          </div>
          
          <div class="card-details">
            <div class="detail-item">
              <svg class="icon-battery" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h13a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V9a2 2 0 012-2zm17 4v2"></path>
              </svg>
              <span>{{ device.battery }}</span>
            </div>
            
            <div class="detail-item">
              <svg class="icon-bluetooth" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 7l10 10-5 5V2l5 5-10 10"></path>
              </svg>
              <span>{{ device.bluetooth }}</span>
            </div>
          </div>
          
          <div class="card-footer">
            <span class="last-activity">Ultima activitate: {{ device.lastActivity }}</span>
          </div>
        </div>

        <div class="card-action">
          <svg class="icon-arrow" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
          </svg>
        </div>
      </div>
    </div>

  </div>
</div>
